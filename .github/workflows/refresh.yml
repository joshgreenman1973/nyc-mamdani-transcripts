name: Refresh corpus

on:
  schedule:
    # 11:00 UTC ≈ 7:00 a.m. ET (EDT) / 6:00 a.m. ET (EST).
    - cron: "0 11 * * *"
    # 20:00 UTC ≈ 4:00 p.m. ET (EDT) / 3:00 p.m. ET (EST) — afternoon catch-up.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube deps
        run: pip install yt-dlp youtube-transcript-api

      - name: Scrape nyc.gov news
        run: python3 scrape.py

      - name: Scrape NYC Mayor's Office YouTube channel
        run: python3 scrape_youtube.py
        # YouTube can rate-limit; treat per-video failures as non-fatal so
        # the daily refresh still commits the nyc.gov scrape.
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild search vectors and topic trends if corpus changed
        run: |
          if git diff --quiet data/corpus.json; then
            echo "Corpus unchanged — skipping rebuild."
            exit 0
          fi
          npm install --no-audit --no-fund
          node build_embeddings.mjs
          # Topic tagging + trend matrix + extractive digest. No deps, no API.
          node build_topics.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/corpus.json; then
            echo "No changes."
            exit 0
          fi
          git add data/corpus.json data/embeddings.json data/topics.json
          git commit -m "Refresh corpus: $(date -u +%Y-%m-%d)"
          git push
