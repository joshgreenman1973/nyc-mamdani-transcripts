name: Refresh corpus

on:
  schedule:
    # 11:00 UTC ≈ 7:00 a.m. ET (EDT) / 6:00 a.m. ET (EST).
    - cron: "0 11 * * *"
    # 20:00 UTC ≈ 4:00 p.m. ET (EDT) / 3:00 p.m. ET (EST) — afternoon catch-up.
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube deps
        run: pip install yt-dlp youtube-transcript-api

      - name: Scrape nyc.gov news
        run: python3 scrape.py

      - name: List and match NYC Mayor's Office YouTube videos
        id: youtube
        env:
          # Caption requests from Actions runners are IpBlocked by YouTube every
          # time — this job had never once ingested one. Listing and matching
          # work fine from here; captions come from the launchd job on Josh's
          # Mac (docs/youtube-captions.md).
          YT_CAPTIONS: "0"
        run: python3 scrape_youtube.py
        # Listing can still break; the guard step below turns the run red so a
        # total failure is never silent.
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild search vectors and topic trends if corpus changed
        run: |
          if git diff --quiet data/corpus.json; then
            echo "Corpus unchanged — skipping rebuild."
            exit 0
          fi
          npm install --no-audit --no-fund
          node build_embeddings.mjs
          # Topic tagging + trend matrix + extractive digest. No deps, no API.
          node build_topics.mjs
          # Press Q&A catalogue (reads topics.json for theme tags). Stdlib only.
          python3 build_qa.py

      # Commitments ledger: new items only (cached in commitments_raw.jsonl).
      # Uses the Claude API; without the ANTHROPIC_API_KEY secret every script
      # here skips cleanly and the ledger just stops growing.
      - name: Extract commitments from new items
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic==0.84.0
          python3 extract_commitments.py --incremental --max-items 60
          python3 build_commitments.py
          python3 group_commitments.py
          python3 build_commitments.py
        continue-on-error: true

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/corpus.json && git diff --quiet -- 'data/commitments*'; then
            echo "No changes."
            exit 0
          fi
          git add data/corpus.json data/embeddings.json data/topics.json data/qa.json data/commitments*
          git commit -m "Refresh corpus: $(date -u +%Y-%m-%d)"

          # The rebuild above takes several minutes, and anything pushed to main
          # in that window makes this push a non-fast-forward. That is what
          # killed the 2026-09-30 20:00 UTC run: a one-line footer commit landed
          # at 20:17 while the embeddings were still building, and the single
          # unretried `git push` failed with the whole corpus already built.
          # Replay onto the new tip and try again.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected on attempt $attempt — origin moved during the rebuild."
            git fetch origin
            if git rebase origin/main; then
              continue
            fi
            # A conflict here means origin's new commit also regenerated
            # data/*.json (the local captions job — docs/youtube-captions.md).
            # Those files collide on every line, and keeping our copy wholesale
            # would drop whatever the other run merged in, so there is nothing
            # safe to do but stop. The scrape is idempotent and runs twice a
            # day: the next run re-derives everything from the new base.
            git rebase --abort
            echo "::error::origin/main regenerated data/*.json while this run was building. Nothing pushed; the next scheduled run will re-derive on the new base."
            exit 1
          done
          echo "::error::still could not push after 3 attempts."
          exit 1

      # Runs after the commit so nyc.gov results still land, but the run goes
      # red when the YouTube scrape failed outright. Without this, a broken
      # scrape reported success daily for three months.
      - name: Surface a failed YouTube scrape
        if: steps.youtube.outcome == 'failure'
        run: |
          echo "::error::scrape_youtube.py failed — no channel videos listed."
          exit 1

      # Same pattern, for the scrapers scrape.py chains. They must not sink the
      # nyc.gov commit, so their exit codes are collected and checked here
      # instead — otherwise a source that stops running is indistinguishable
      # from a source with nothing new, and rots unnoticed for months.
      - name: Surface a failed chained scraper
        if: always()
        run: |
          if [ -f .chained-failures ]; then
            while read -r line; do echo "::error::chained scraper: $line"; done < .chained-failures
            exit 1
          fi
          echo "All chained scrapers exited clean."
